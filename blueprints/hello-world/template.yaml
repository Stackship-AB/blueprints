apiVersion: blueprints.stackship.se/v2
kind: BlueprintTemplate

# The catalog's smoke test: the smallest blueprint that still exercises the whole
# path — parameters, a rendered file, a probe, an ingress with a certificate and
# an output URL — so "did the platform come up correctly?" is one deploy away.
#
# It is built around docker.io/library/hello-world, and that image dictates the
# shape of this file. `hello-world` prints its greeting and EXITS 0. A component
# runs as a Deployment with restartPolicy Always, so the same image as the main
# container is a guaranteed CrashLoopBackOff — the platform would be working
# perfectly and the instance would still never go healthy. So it runs where a
# run-to-completion container belongs: as an init container. Its classic message
# lands in the `hello` init container's logs (that is the thing to go read after
# deploying), and the pod only proceeds once it has exited cleanly.
#
# The image is FROM scratch with a single static binary and no shell, so there
# is no way to make it loop and no way to capture its output from inside the
# container — anything that keeps the pod alive has to be a second image. That
# is nginx-unprivileged, serving a one-page greeting rendered from the
# `greeting` parameter. It listens on 8080 as uid 101, so no root and no
# securityContext gymnastics are needed to make it serve.

metadata:
  slug: hello-world
  title: Hello World
  description: >-
    A minimal example blueprint. Runs Docker's hello-world image at startup and
    serves a greeting page over HTTPS — useful for verifying that deploys,
    ingress and certificates work, and as a template to copy when authoring
    your own blueprint.
  version: "1.0.0"
  category: Examples
  tags: [example, hello-world, demo, smoke-test]
  documentation: https://hub.docker.com/_/hello-world

parameters:
  - name: greeting
    type: String
    label: Greeting
    description: Text shown on the page this instance serves.
    default: "Hello from Stackship!"
    validation:
      # The value is rendered into HTML. Markup characters are rejected rather
      # than escaped: a parameter on an example blueprint is not worth a stored
      # XSS in whichever browser opens the page.
      pattern: "^[^<>&\"']{1,80}$"
      message: >-
        1-80 characters, without < > & " or ' — the greeting is rendered into
        an HTML page.

  - name: ingress_host
    type: String
    label: Ingress Hostname
    description: >-
      Public hostname for the instance. Defaults to the instance name under the
      platform domain — override to use a custom domain.
    default: "[%name%].{{domain_suffix}}"

  - name: ingress_certificate_issuer
    type: String
    label: Certificate Issuer
    description: cert-manager ClusterIssuer name
    default: "{{cert_issuer}}"
    advanced: true

outputs:
  - name: url
    label: Greeting Page
    description: The page this instance serves
    type: Url
    value: "https://[%ingress_host%]/"

instance:
  components:
    - name: hello-world
      startupOrder: 1
      replicas: 1
      computePlan: small

      initContainers:
        # The actual docker.io/library/hello-world. Runs to completion before
        # the web container starts; read its logs to see the classic message.
        # Tag `linux` rather than `latest`: latest's manifest list also carries
        # Windows images, and pinning to linux keeps the pull unambiguous.
        - name: hello
          image: docker.io/library/hello-world
          tag: "linux"

      containers:
        - name: web
          image: docker.io/nginxinc/nginx-unprivileged
          tag: "1.31-alpine"
          ports:
            - name: http
              port: 8080
          probes:
            readiness:
              type: http
              port: http
              path: /
              initialDelaySeconds: 2
              periodSeconds: 10
              failureThreshold: 6
            liveness:
              type: http
              port: http
              path: /
              initialDelaySeconds: 10
              periodSeconds: 20
              failureThreshold: 3
          mounts:
            - volume: page
              path: /usr/share/nginx/html
              readOnly: true

      volumes:
        - name: page
          files:
            content:
              index.html: |
                <!doctype html>
                <html lang="en">
                  <head>
                    <meta charset="utf-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1">
                    <title>[%greeting%]</title>
                    <style>
                      :root { color-scheme: light dark; }
                      body {
                        margin: 0; min-height: 100vh; display: grid; place-items: center;
                        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
                        background: #0f1115; color: #e8eaed;
                      }
                      main { text-align: center; padding: 2rem; }
                      h1 { font-size: clamp(1.75rem, 6vw, 3rem); margin: 0 0 .75rem; }
                      p { margin: .25rem 0; color: #9aa0a6; }
                      code { color: #e8eaed; }
                    </style>
                  </head>
                  <body>
                    <main>
                      <h1>[%greeting%]</h1>
                      <p>Served by instance <code>[%name%]</code> on Stackship.</p>
                      <p>The <code>hello-world</code> container already ran — its message is in the <code>hello</code> init container's logs.</p>
                    </main>
                  </body>
                </html>

  endpoints:
    - name: web
      component: hello-world
      port: http
      expose: ingress
      hostname: "[%ingress_host%]"
      issuer: "[%ingress_certificate_issuer%]"
