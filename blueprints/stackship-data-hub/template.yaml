apiVersion: blueprints.stackship.se/v2
kind: BlueprintTemplate

# Ported from the v1 rendered-manifest form. Alongside supabase this is the
# template that needed the D7/D8/D9 features: a conditional bundled database,
# postgres at uid 70 with an exec probe, a license file delivered as sensitive
# content, and one hostname carrying the API and the web UI on different paths.

metadata:
  slug: stackship-data-hub
  title: Stackship Data Hub
  description: >-
    Collect data from databases, APIs and files, transform it on the way in,
    build views visually, and publish them as versioned REST endpoints.
  version: "2.1"
  category: Platforms
  tags: [stackship, data, etl, ingestion, analytics, postgres, api]
  documentation: https://gitlab.stackship.se/stackship-apps/data-lake/-/blob/main/DRIFT.md

parameters:
  - name: image_tag
    type: String
    label: Image Tag
    description: >-
      Tag of the datahub/api and datahub/web images. Pin a specific tag for a
      production installation so a redeploy cannot silently move the version.
    default: "latest"

  - name: db_availability
    type: Select
    label: Database
    description: >-
      A Stackship-managed PostgreSQL, with backups and the platform's own
      upgrade path. High availability runs three instances so the loss of a
      node promotes a replica instead of taking the database down.
    options: ["Single Instance", "High Available"]
    default: "Single Instance"

  - name: db_storage_size
    type: Select
    label: Database Storage
    description: Volume for the managed PostgreSQL
    options: ["5Gi", "10Gi", "20Gi", "50Gi"]
    default: "10Gi"

  - name: file_storage_size
    type: Select
    label: File Storage
    description: Volume for uploads and inbound files
    options: ["5Gi", "10Gi", "20Gi", "50Gi"]
    default: "10Gi"

  # Both keys below are base64-decoded by the application before use, so they are generated
  # as base64 rather than as a random string. Without generateSpec the generator falls back to
  # an alphabet containing !@#$%^&* — not valid base64 — and the API fails at startup with
  # "The input is not a valid Base-64 string". generateLength counts BYTES on this path.
  - name: jwt_signing_key
    type: Secret
    label: JWT Signing Key
    generate: true
    # TokenService.BuildKey requires at least 32 bytes after decoding.
    generateSpec: base64
    generateLength: 64

  - name: secrets_key
    type: Secret
    label: Secrets Encryption Key
    generate: true
    # AesSecretProtector requires exactly 32 bytes (AES-256) after decoding.
    generateSpec: base64
    generateLength: 32

  - name: license_base64
    type: Secret
    label: License File
    description: License JSON. Delivered to the pod as a file, never as an env var.
    default: ""

  - name: oidc_enabled
    type: Boolean
    label: Enable OIDC Sign-in
    default: "false"
    advanced: true

  - name: oidc_display_name
    type: String
    label: OIDC Display Name
    default: ""
    advanced: true

  - name: oidc_authority
    type: String
    label: OIDC Authority
    default: ""
    advanced: true

  - name: oidc_client_id
    type: String
    label: OIDC Client ID
    default: ""
    advanced: true

  - name: oidc_client_secret
    type: Secret
    label: OIDC Client Secret
    default: ""
    advanced: true

  - name: ingress_host
    type: String
    label: Public Hostname
    default: "[%name%].{{domain_suffix}}"

  - name: ingress_certificate_issuer
    type: String
    label: Certificate Issuer
    default: "{{cert_issuer}}"
    advanced: true

outputs:
  - name: app_url
    label: Application URL
    type: Url
    value: "https://[%ingress_host%]/"
  - name: published_api_url
    label: Published API base
    type: Url
    value: "https://[%ingress_host%]/datalager"

# The database, provisioned by the platform rather than run as a container here.
#
# Replaces a bundled `postgres:17-alpine` component. That pod had no backups, no failover and
# no upgrade path, and — because every container runs with ALL capabilities dropped — a stock
# image that adjusts ownership of its data directory at startup cannot reliably start at all.
# This is the same PostgreSQL the platform offers on its own, run by the operator that knows
# how to run it.
#
# Its connection details land in the instance vault under the two keys the API already reads,
# so the containers below are unchanged by the switch.
resources:
  - name: db
    type: postgres
    availability: "[%db_availability%]"
    storage: "[%db_storage_size%]"
    exposes:
      # One database, two names. The application separates its metadata from its lake
      # logically, not physically, and both settings expect the ADO.NET key=value form.
      - output: connectionString
        vaultKey: connectionstring_metadata
      - output: connectionString
        vaultKey: connectionstring_lake

instance:
  components:
    - name: api
      startupOrder: 1
      replicas: 1
      computePlan: small
      containers:
        - name: api
          image: registry.stackship.se/datahub/api
          tag: "[%image_tag%]"
          # The image's own ENTRYPOINT, declared so the operator can wrap it: a
          # container with a vault-backed variable runs through the secret-exec
          # shim, and Kubernetes has no way to PREPEND to an entrypoint —
          # setting command replaces it. Without this every ConnectionStrings__*
          # and signing key below is resolved and then dropped.
          command:
            - dotnet
            - Stackship.DataLake.Api.dll
          ports:
            - name: http
              port: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: App__FrontendUrl
              value: "https://[%ingress_host%]"
            - name: App__PublicApiBaseUrl
              value: "https://[%ingress_host%]/datalager"
            - name: App__SeedDemoData
              value: "false"
            - name: License__Path
              value: "/etc/stackship/license/license.json"
            - name: Uploads__Path
              value: "/app/data/uploads"
            - name: Inbound__Path
              value: "/app/data/inkommande"
            - name: ConnectionStrings__Metadata
              secretRef: { vault: "[%instance_vault%]", key: connectionstring_metadata }
            - name: ConnectionStrings__Lake
              secretRef: { vault: "[%instance_vault%]", key: connectionstring_lake }
            - name: Jwt__SigningKey
              secretRef: { vault: "[%instance_vault%]", key: jwt_signing_key }
            - name: Secrets__Key
              secretRef: { vault: "[%instance_vault%]", key: secrets_key }
            - name: Oidc__Enabled
              value: "[%oidc_enabled%]"
            - name: Oidc__DisplayName
              value: "[%oidc_display_name%]"
            - name: Oidc__Authority
              value: "[%oidc_authority%]"
            - name: Oidc__ClientId
              value: "[%oidc_client_id%]"
            - name: Oidc__ClientSecret
              secretRef: { vault: "[%instance_vault%]", key: oidc_client_secret }
          probes:
            readiness:
              type: http
              port: http
              path: /health
              initialDelaySeconds: 10
              periodSeconds: 10
              failureThreshold: 6
            liveness:
              type: http
              port: http
              path: /health
              initialDelaySeconds: 30
              periodSeconds: 20
              failureThreshold: 3
          mounts:
            - volume: data
              path: /app/data
            - volume: license
              path: /etc/stackship/license
              readOnly: true
      volumes:
        - name: data
          persistent:
            size: "[%file_storage_size%]"
            tier: standard
            fsGroup: 10001
        - name: license
          files:
            # sensitive: the license is licensed material, so it lands in a
            # Secret and reads back redacted rather than in a ConfigMap.
            sensitive: true
            content:
              license.json: "[%license_base64%]"

    - name: web
      startupOrder: 2
      replicas: 1
      computePlan: small
      containers:
        - name: web
          image: registry.stackship.se/datahub/web
          tag: "[%image_tag%]"
          ports:
            - name: http
              port: 80
          probes:
            readiness:
              type: http
              port: http
              path: /
              initialDelaySeconds: 5
              periodSeconds: 10
              failureThreshold: 6
            liveness:
              type: http
              port: http
              path: /
              initialDelaySeconds: 15
              periodSeconds: 20
              failureThreshold: 3

  endpoints:
    # One hostname, two backends. The web image is built with an empty
    # VITE_API_URL precisely so the frontend calls the origin it was served
    # from, which only works if both sit on the same host.
    - name: api
      component: api
      port: http
      expose: ingress
      hostname: "[%ingress_host%]"
      paths: ["/api", "/datalager", "/signin-oidc", "/health"]
      issuer: "[%ingress_certificate_issuer%]"

    - name: web
      component: web
      port: http
      expose: ingress
      hostname: "[%ingress_host%]"
      paths: ["/"]
      issuer: "[%ingress_certificate_issuer%]"
