    - name: functions
      startupOrder: 3
      computePlan: small
      minComputePlan: small
      initContainers:
        # Seeds the persistent functions dir from the packaged entrypoint on
        # first boot only, so a user's own edits survive a restart.
        - name: seed
          image: busybox
          tag: "1.36"
          command:
            - sh
            - -c
            - |
              mkdir -p /functions/main
              if [ ! -f /functions/main/index.ts ]; then
                cp /seed/index.ts /functions/main/index.ts
              fi
          mounts:
            - volume: data
              path: /functions
            - volume: seed
              path: /seed
      containers:
        - name: edge-runtime
          image: registry.stackship.se/blueprints/supabase/functions
          tag: "v1.71.2"
          # The image's own ENTRYPOINT and CMD, declared so the operator can wrap
          # them: a container with a vault-backed variable runs through the
          # secret-exec shim, and Kubernetes has no way to PREPEND to an
          # entrypoint — setting command replaces it. Without this the secret is
          # resolved and then dropped, which is how postgres reported its password
          # unset moments after secret-init reported resolving it.
          command:
            - edge-runtime
          # The image's CMD is empty and bare `edge-runtime` prints its CLI help
          # and exits — the runtime has never been startable without arguments.
          # The old blueprint chart supplied these; the v2 port dropped them, and
          # nothing noticed because no instance ever reached this wave until the
          # first full run. Same values as the working prod blueprint.
          args:
            - start
            - --main-service
            - /home/deno/functions/main
          ports:
            - name: http
              port: 9000
          env:
            - name: JWT_SECRET
              secretRef: { vault: "[%instance_vault%]", key: jwt_secret }
            - name: SUPABASE_URL
              value: "http://[%name%]-gateway:8000"
            - name: SUPABASE_PUBLIC_URL
              value: "https://[%ingress_host%]"
            - name: SUPABASE_ANON_KEY
              secretRef: { vault: "[%instance_vault%]", key: anon_key }
            - name: SUPABASE_SERVICE_ROLE_KEY
              secretRef: { vault: "[%instance_vault%]", key: service_role_key }
            - name: SUPABASE_DB_URL
              secretRef: { vault: "[%instance_vault%]", key: db_url }
            - name: VERIFY_JWT
              value: "true"
          probes:
            readiness:
              type: tcp
              port: http
              initialDelaySeconds: 10
              periodSeconds: 10
              failureThreshold: 6
            liveness:
              type: tcp
              port: http
              initialDelaySeconds: 30
              periodSeconds: 20
              failureThreshold: 3
          mounts:
            - volume: data
              path: /home/deno/functions
      volumes:
        - name: data
          persistent:
            size: 1Gi
            tier: standard
        - name: seed
          files:
            content:
              index.ts: |
                import * as jose from 'https://deno.land/x/jose@v4.14.4/index.ts'

                console.log('main function started')

                const JWT_SECRET = Deno.env.get('JWT_SECRET')
                const SUPABASE_URL = Deno.env.get('SUPABASE_URL')
                const VERIFY_JWT = Deno.env.get('VERIFY_JWT') === 'true'

                let SUPABASE_JWT_KEYS: ReturnType<typeof jose.createRemoteJWKSet> | null = null
                if (SUPABASE_URL) {
                  try {
                    SUPABASE_JWT_KEYS = jose.createRemoteJWKSet(
                      new URL('/auth/v1/.well-known/jwks.json', SUPABASE_URL)
                    )
                  } catch (e) {
                    console.error('Failed to fetch JWKS from SUPABASE_URL:', e)
                  }
                }

                function getAuthToken(req: Request) {
                  const authHeader = req.headers.get('authorization')
                  if (!authHeader) throw new Error('Missing authorization header')
                  const [bearer, token] = authHeader.split(' ')
                  if (bearer !== 'Bearer') throw new Error(`Auth header is not 'Bearer {token}'`)
                  return token
                }

                async function isValidLegacyJWT(jwt: string): Promise<boolean> {
                  if (!JWT_SECRET) return false
                  const secretKey = new TextEncoder().encode(JWT_SECRET)
                  try { await jose.jwtVerify(jwt, secretKey); return true } catch { return false }
                }

                async function isValidJWT(jwt: string): Promise<boolean> {
                  if (!SUPABASE_JWT_KEYS) return false
                  try { await jose.jwtVerify(jwt, SUPABASE_JWT_KEYS); return true } catch { return false }
                }

                async function isValidHybridJWT(jwt: string): Promise<boolean> {
                  const { alg } = jose.decodeProtectedHeader(jwt)
                  if (alg === 'HS256') return await isValidLegacyJWT(jwt)
                  if (alg === 'ES256' || alg === 'RS256') return await isValidJWT(jwt)
                  return false
                }

                Deno.serve(async (req: Request) => {
                  if (req.method !== 'OPTIONS' && VERIFY_JWT) {
                    try {
                      const token = getAuthToken(req)
                      if (!(await isValidHybridJWT(token))) {
                        return new Response(JSON.stringify({ msg: 'Invalid JWT' }),
                          { status: 401, headers: { 'Content-Type': 'application/json' } })
                      }
                    } catch (e) {
                      return new Response(JSON.stringify({ msg: e.toString() }),
                        { status: 401, headers: { 'Content-Type': 'application/json' } })
                    }
                  }

                  const url = new URL(req.url)
                  const service_name = url.pathname.split('/')[1]
                  if (!service_name) {
                    return new Response(JSON.stringify({ msg: 'missing function name in request' }),
                      { status: 400, headers: { 'Content-Type': 'application/json' } })
                  }

                  const servicePath = `/home/deno/functions/${service_name}`
                  const envVarsObj = Deno.env.toObject()
                  const envVars = Object.keys(envVarsObj).map((k) => [k, envVarsObj[k]])

                  try {
                    const worker = await (globalThis as any).EdgeRuntime.userWorkers.create({
                      servicePath,
                      memoryLimitMb: 150,
                      workerTimeoutMs: 60_000,
                      noModuleCache: false,
                      importMapPath: null,
                      envVars,
                    })
                    return await worker.fetch(req)
                  } catch (e) {
                    return new Response(JSON.stringify({ msg: e.toString() }),
                      { status: 500, headers: { 'Content-Type': 'application/json' } })
                  }
                })
    - name: studio
      startupOrder: 4
      computePlan: medium
      minComputePlan: medium
      containers:
        - name: studio
          image: registry.stackship.se/blueprints/supabase/studio
          tag: "2026.10.26-sha-478bd88"
          # The image's own ENTRYPOINT and CMD, declared so the operator can wrap
          # them: a container with a vault-backed variable runs through the
          # secret-exec shim, and Kubernetes has no way to PREPEND to an
          # entrypoint — setting command replaces it. Without this the secret is
          # resolved and then dropped, which is how postgres reported its password
          # unset moments after secret-init reported resolving it.
          command:
            - docker-entrypoint.sh
          args:
            - node
            - apps/studio/server.js
          ports:
            - name: http
              port: 3000
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: DEFAULT_ORGANIZATION_NAME
              value: "Default Organization"
            - name: DEFAULT_PROJECT_NAME
              value: "Default Project"
            - name: STUDIO_PG_META_URL
              value: "http://[%name%]-meta:8080"
            - name: PG_META_CRYPTO_KEY
              secretRef: { vault: "[%instance_vault%]", key: pg_meta_crypto_key }
            - name: PGRST_DB_SCHEMAS
              value: "public,storage"
            - name: PGRST_DB_MAX_ROWS
              value: "1000"
            - name: SUPABASE_URL
              value: "http://[%name%]-gateway:8000"
            - name: SUPABASE_PUBLIC_URL
              value: "https://[%ingress_host%]"
            - name: SUPABASE_ANON_KEY
              secretRef: { vault: "[%instance_vault%]", key: anon_key }
            - name: SUPABASE_SERVICE_KEY
              secretRef: { vault: "[%instance_vault%]", key: service_role_key }
            - name: AUTH_JWT_SECRET
              secretRef: { vault: "[%instance_vault%]", key: jwt_secret }
            - name: POSTGRES_HOST
              secretRef: { vault: "[%instance_vault%]", key: db_host }
            - name: POSTGRES_PORT
              secretRef: { vault: "[%instance_vault%]", key: db_port }
            - name: POSTGRES_DB
              secretRef: { vault: "[%instance_vault%]", key: db_name }
            - name: POSTGRES_USER
              secretRef: { vault: "[%instance_vault%]", key: db_owner }
            - name: POSTGRES_PASSWORD
              secretRef: { vault: "[%instance_vault%]", key: db_owner_password }
            - name: NEXT_PUBLIC_ENABLE_LOGS
              value: "false"
            - name: NEXT_ANALYTICS_BACKEND_PROVIDER
              value: "postgres"
            - name: EDGE_FUNCTIONS_MANAGEMENT_FOLDER
              value: "/app/edge-functions"
            - name: SNIPPETS_MANAGEMENT_FOLDER
              value: "/app/snippets"
          probes:
            readiness:
              type: tcp
              port: http
              initialDelaySeconds: 10
              periodSeconds: 10
              failureThreshold: 6
            liveness:
              type: tcp
              port: http
              initialDelaySeconds: 30
              periodSeconds: 20
              failureThreshold: 3
          mounts:
            - volume: edge-functions
              path: /app/edge-functions
            - volume: snippets
              path: /app/snippets
      volumes:
        - name: edge-functions
          emptyDir: {}
        - name: snippets
          emptyDir: {}
  endpoints:
    # Both endpoints share ONE hostname. They stay separate objects because the
    # forward-auth wiring is per-object on nginx and only studio is guarded —
    # the API paths carry their own JWT auth and must not sit behind the portal
    # login. The certificate is keyed by host, so the two share one.
    - name: api
      component: gateway
      port: http
      expose: ingress
      hostname: "[%ingress_host%]"
      paths: ["/auth/v1", "/rest/v1", "/storage/v1", "/pg"]
      issuer: "[%ingress_certificate_issuer%]"
      authGuard: false

    - name: studio
      component: studio
      port: http
      expose: ingress
      hostname: "[%ingress_host%]"
      paths: ["/"]
      issuer: "[%ingress_certificate_issuer%]"
      authGuard: true
