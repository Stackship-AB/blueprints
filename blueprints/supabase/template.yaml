apiVersion: blueprints.stackship.se/v2
kind: BlueprintTemplate

# Ported from the v1 rendered-manifest form (13 raw Kubernetes documents) to the
# v2 template document. This template is what falsified the first cut of the
# format: it needs file content, subPath mounts, exec probes, a specific uid,
# somewhere for generated secrets to live, and one hostname carrying several
# paths — none of which §2 could express until D7/D8/D9.
#
# Structural changes worth knowing when comparing against the old files:
#   - The `secrets` component is gone. Its five generated values and five
#     derived connection strings live in the instance's Stackship Secrets vault
#     and are referenced with env[].secretRef, so no secret is ever written into
#     the CR where a containerinstance/read holder could see it.
#   - The two Ingress documents become two endpoints sharing one hostname: the
#     API paths on the gateway, `/` on studio, and only studio is auth-guarded.
#
# Since 4.0 the database is a platform PostgreSQL server and database, chosen or
# created in the deploy wizard, instead of a bundled container. Supabase's roles
# are the database's own roles (resources.db.roles), named <owner>_<role> on the
# server so two instances can share one; every service is told those names, and
# the anon and service-role keys carry them. The `setup` component creates the
# schemas and grants Supabase's services expect, as the database owner, before
# any of them start. Features that need extensions the platform image does not
# ship (pg_graphql, pg_net, pgsodium, pg_cron) are not available, and neither
# is Realtime: its migrations name the anon/authenticated/service_role roles
# literally and set a superuser-only parameter, so it cannot run on a platform
# server without a superuser (blueprint-database-binding spec §8).

metadata:
  slug: supabase
  title: Supabase
  description: >-
    Self-hosted Supabase — open source Firebase alternative with PostgreSQL
    database, authentication, instant APIs, storage, and
    Studio dashboard.
  version: "4.0"
  category: Databases
  tags: [supabase, database, auth, storage, api, postgres]
  documentation: https://supabase.com/docs/guides/self-hosting

parameters:
  - name: jwt_secret
    type: Secret
    label: JWT Secret
    description: Shared secret signing every JWT. Auto-generated.
    generate: true
    generateLength: 64

  - name: anon_key
    type: Secret
    label: Anonymous API Key
    description: Pre-configured JWT granting anonymous access to public endpoints.
    generate: true
    generateSpec: jwt
    generateClaims:
      # The database's own anon role, which exists once the database does: the
      # key is generated after provisioning.
      role: "[%resources.db.role.anon.username%]"
      iss: supabase

  - name: service_role_key
    type: Secret
    label: Service Role Key
    description: >-
      Pre-configured JWT with full administrative access that bypasses Row Level
      Security. Never expose it in client-side code.
    generate: true
    generateSpec: jwt
    generateClaims:
      role: "[%resources.db.role.service_role.username%]"
      iss: supabase

  - name: pg_meta_crypto_key
    type: Secret
    label: pg-meta crypto key
    description: 32-byte key pg-meta uses to encrypt foreign-data-wrapper credentials.
    generate: true
    generateLength: 32

  - name: ingress_host
    type: String
    label: Public Hostname
    description: >-
      Hostname clients and Studio use to reach this instance. Defaults to the
      instance name under the platform domain — override for a custom domain.
    default: "[%name%].{{domain_suffix}}"

  - name: ingress_certificate_issuer
    type: String
    label: Certificate Issuer
    description: cert-manager ClusterIssuer for the TLS certificate.
    default: "{{cert_issuer}}"
    advanced: true

outputs:
  - name: studio_url
    label: Studio URL
    description: Supabase Studio web UI
    type: Url
    value: "https://[%ingress_host%]/"
  - name: api_url
    label: API URL
    description: Public REST / Auth / Storage gateway
    type: Url
    value: "https://[%ingress_host%]/"

resources:
  - name: db
    type: postgres
    title: Supabase database
    databaseName: "[%name%]"
    storage: 10Gi
    roles:
      - { name: anon }
      - { name: authenticated }
      - { name: service_role, bypassRls: true }
      - { name: authenticator, login: true, memberOf: [anon, authenticated, service_role] }
      - { name: auth_admin, login: true }
      - { name: storage_admin, login: true, memberOf: [anon, authenticated, service_role] }
    exposes:
      - { output: uri, vaultKey: db_url }
      - { output: host, vaultKey: db_host }
      - { output: port, vaultKey: db_port }
      - { output: database, vaultKey: db_name }
      - { output: username, vaultKey: db_owner }
      - { output: password, vaultKey: db_owner_password }
      - { output: role.authenticator.uri, vaultKey: db_url_rest }
      - { output: role.auth_admin.uri, vaultKey: db_url_auth }
      - { output: role.storage_admin.uri, vaultKey: db_url_storage }
      - { output: role.anon.username, vaultKey: db_role_anon }
      - { output: role.authenticated.username, vaultKey: db_role_authenticated }
      - { output: role.service_role.username, vaultKey: db_role_service }
      - { output: role.auth_admin.username, vaultKey: db_role_auth_admin }
      - { output: role.storage_admin.username, vaultKey: db_role_storage_admin }

instance:
  components:
    # Prepares the database for Supabase's services, as its owner: the schemas
    # they migrate into, owned by the role each connects as, the grants between
    # them. Idempotent, and serialised with an
    # advisory lock, so a restart re-runs it harmlessly. Startup order 1, so
    # every service starts against a prepared database.
    - name: setup
      startupOrder: 1
      replicas: 1
      computePlan: nano
      initContainers:
        - name: prepare
          image: postgres
          tag: "17-alpine"
          command:
            - sh
            - -c
            - >-
              psql "$DB_URL" -v ON_ERROR_STOP=1
              -v owner="$DB_OWNER" -v database="$DB_NAME"
              -v anon="$ROLE_ANON" -v authenticated="$ROLE_AUTHENTICATED" -v service_role="$ROLE_SERVICE"
              -v auth_admin="$ROLE_AUTH_ADMIN" -v storage_admin="$ROLE_STORAGE_ADMIN"
              -f /setup/setup.sql
          env:
            - name: DB_URL
              secretRef: { vault: "[%instance_vault%]", key: db_url }
            - name: DB_OWNER
              secretRef: { vault: "[%instance_vault%]", key: db_owner }
            - name: DB_NAME
              secretRef: { vault: "[%instance_vault%]", key: db_name }
            - name: ROLE_ANON
              secretRef: { vault: "[%instance_vault%]", key: db_role_anon }
            - name: ROLE_AUTHENTICATED
              secretRef: { vault: "[%instance_vault%]", key: db_role_authenticated }
            - name: ROLE_SERVICE
              secretRef: { vault: "[%instance_vault%]", key: db_role_service }
            - name: ROLE_AUTH_ADMIN
              secretRef: { vault: "[%instance_vault%]", key: db_role_auth_admin }
            - name: ROLE_STORAGE_ADMIN
              secretRef: { vault: "[%instance_vault%]", key: db_role_storage_admin }
          mounts:
            - volume: setup
              path: /setup
              readOnly: true
      containers:
        - name: idle
          image: busybox
          tag: "1.36"
          command: [sleep, infinity]
      volumes:
        - name: setup
          files:
            content:
              setup.sql: |
                SELECT pg_advisory_lock(hashtext('stackship-supabase-setup'));

                CREATE SCHEMA IF NOT EXISTS extensions;
                CREATE EXTENSION IF NOT EXISTS "uuid-ossp" WITH SCHEMA extensions;
                CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions;
                GRANT USAGE ON SCHEMA extensions TO :"anon", :"authenticated", :"service_role", :"auth_admin", :"storage_admin";

                GRANT USAGE ON SCHEMA public TO :"anon", :"authenticated", :"service_role";
                ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO :"anon", :"authenticated", :"service_role";
                ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO :"anon", :"authenticated", :"service_role";
                ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO :"anon", :"authenticated", :"service_role";

                GRANT CREATE ON DATABASE :"database" TO :"auth_admin", :"storage_admin";
                CREATE SCHEMA IF NOT EXISTS auth AUTHORIZATION :"auth_admin";
                CREATE SCHEMA IF NOT EXISTS storage AUTHORIZATION :"storage_admin";

                SET ROLE :"auth_admin";
                GRANT USAGE ON SCHEMA auth TO :"anon", :"authenticated", :"service_role", :"owner";
                ALTER ROLE :"auth_admin" SET search_path = auth;
                RESET ROLE;

                SET ROLE :"storage_admin";
                GRANT USAGE ON SCHEMA storage TO :"anon", :"authenticated", :"service_role", :"owner";
                ALTER ROLE :"storage_admin" SET search_path = storage;
                RESET ROLE;

                SELECT pg_advisory_unlock(hashtext('stackship-supabase-setup'));
    - name: auth
      startupOrder: 2
      computePlan: small
      minComputePlan: small
      containers:
        - name: auth
          image: registry.stackship.se/blueprints/supabase/gotrue
          tag: "v2.186.0"
          # The image's own ENTRYPOINT and CMD, declared so the operator can wrap
          # them: a container with a vault-backed variable runs through the
          # secret-exec shim, and Kubernetes has no way to PREPEND to an
          # entrypoint — setting command replaces it. Without this the secret is
          # resolved and then dropped, which is how postgres reported its password
          # unset moments after secret-init reported resolving it.
          command:
            - auth
          ports:
            - name: http
              port: 9999
          env:
            - name: GOTRUE_API_HOST
              value: "0.0.0.0"
            - name: GOTRUE_API_PORT
              value: "9999"
            - name: API_EXTERNAL_URL
              value: "http://[%name%]-gateway:8000"
            - name: GOTRUE_DB_DRIVER
              value: "postgres"
            - name: GOTRUE_DB_DATABASE_URL
              secretRef: { vault: "[%instance_vault%]", key: db_url_auth }
            - name: GOTRUE_SITE_URL
              value: "http://[%name%]-studio:3000"
            - name: GOTRUE_URI_ALLOW_LIST
              value: ""
            - name: GOTRUE_DISABLE_SIGNUP
              value: "false"
            - name: GOTRUE_JWT_SECRET
              secretRef: { vault: "[%instance_vault%]", key: jwt_secret }
            - name: GOTRUE_JWT_EXP
              value: "3600"
            - name: GOTRUE_DB_NAMESPACE
              value: "auth"
            - name: GOTRUE_JWT_DEFAULT_GROUP_NAME
              secretRef: { vault: "[%instance_vault%]", key: db_role_authenticated }
            - name: GOTRUE_JWT_ADMIN_ROLES
              secretRef: { vault: "[%instance_vault%]", key: db_role_service }
            - name: GOTRUE_JWT_AUD
              value: "authenticated"
            - name: GOTRUE_JWT_ISSUER
              value: "http://[%name%]-gateway:8000/auth/v1"
            - name: GOTRUE_EXTERNAL_EMAIL_ENABLED
              value: "true"
            - name: GOTRUE_MAILER_AUTOCONFIRM
              value: "true"
            - name: GOTRUE_SMS_AUTOCONFIRM
              value: "true"
          probes:
            readiness:
              type: http
              port: http
              path: /health
              initialDelaySeconds: 5
              periodSeconds: 10
              failureThreshold: 6
            liveness:
              type: http
              port: http
              path: /health
              initialDelaySeconds: 15
              periodSeconds: 20
              failureThreshold: 3
    - name: rest
      startupOrder: 2
      computePlan: small
      minComputePlan: small
      containers:
        - name: rest
          image: registry.stackship.se/blueprints/supabase/postgrest
          tag: "v14.8"
          # The image's own ENTRYPOINT and CMD, declared so the operator can wrap
          # them: a container with a vault-backed variable runs through the
          # secret-exec shim, and Kubernetes has no way to PREPEND to an
          # entrypoint — setting command replaces it. Without this the secret is
          # resolved and then dropped, which is how postgres reported its password
          # unset moments after secret-init reported resolving it.
          command:
            - /bin/postgrest
          ports:
            - name: http
              port: 3000
          env:
            - name: PGRST_DB_URI
              secretRef: { vault: "[%instance_vault%]", key: db_url_rest }
            - name: PGRST_DB_SCHEMAS
              value: "public,storage"
            - name: PGRST_DB_ANON_ROLE
              secretRef: { vault: "[%instance_vault%]", key: db_role_anon }
            - name: PGRST_JWT_SECRET
              secretRef: { vault: "[%instance_vault%]", key: jwt_secret }
            - name: PGRST_DB_USE_LEGACY_GUCS
              value: "false"
            - name: PGRST_APP_SETTINGS_JWT_SECRET
              secretRef: { vault: "[%instance_vault%]", key: jwt_secret }
            - name: PGRST_APP_SETTINGS_JWT_EXP
              value: "3600"
          probes:
            readiness:
              type: http
              port: http
              path: /
              initialDelaySeconds: 5
              periodSeconds: 10
              failureThreshold: 6
            liveness:
              type: http
              port: http
              path: /
              initialDelaySeconds: 15
              periodSeconds: 20
              failureThreshold: 3
    - name: storage
      startupOrder: 2
      computePlan: small
      minComputePlan: small
      containers:
        - name: storage
          image: registry.stackship.se/blueprints/supabase/storage-api
          tag: "v1.84.28"
          # The image's own ENTRYPOINT and CMD, declared so the operator can wrap
          # them: a container with a vault-backed variable runs through the
          # secret-exec shim, and Kubernetes has no way to PREPEND to an
          # entrypoint — setting command replaces it. Without this the secret is
          # resolved and then dropped, which is how postgres reported its password
          # unset moments after secret-init reported resolving it.
          command:
            - docker-entrypoint.sh
          args:
            - node
            - dist/start/server.js
          ports:
            - name: http
              port: 5000
          env:
            - name: ANON_KEY
              secretRef: { vault: "[%instance_vault%]", key: anon_key }
            - name: SERVICE_KEY
              secretRef: { vault: "[%instance_vault%]", key: service_role_key }
            - name: POSTGREST_URL
              value: "http://[%name%]-rest:3000"
            - name: PGRST_JWT_SECRET
              secretRef: { vault: "[%instance_vault%]", key: jwt_secret }
            - name: AUTH_JWT_SECRET
              secretRef: { vault: "[%instance_vault%]", key: jwt_secret }
            - name: DATABASE_URL
              secretRef: { vault: "[%instance_vault%]", key: db_url_storage }
            # Supabase's own roles are the database's, under the names it gave them.
            - name: DB_ANON_ROLE
              secretRef: { vault: "[%instance_vault%]", key: db_role_anon }
            - name: DB_AUTHENTICATED_ROLE
              secretRef: { vault: "[%instance_vault%]", key: db_role_authenticated }
            - name: DB_SERVICE_ROLE
              secretRef: { vault: "[%instance_vault%]", key: db_role_service }
            - name: DB_SUPER_USER
              secretRef: { vault: "[%instance_vault%]", key: db_role_storage_admin }
            - name: DB_INSTALL_ROLES
              value: "false"
            # node-postgres reads sslmode=require as full verification, which the
            # server's own CA fails; libpq, which every other service uses, encrypts
            # without verifying. This makes storage do the same.
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
            - name: STORAGE_PUBLIC_URL
              value: "https://[%ingress_host%]"
            - name: REQUEST_ALLOW_X_FORWARDED_PATH
              value: "true"
            - name: FILE_SIZE_LIMIT
              value: "52428800"
            - name: STORAGE_BACKEND
              value: "file"
            - name: FILE_STORAGE_BACKEND_PATH
              value: "/var/lib/storage"
            - name: TENANT_ID
              value: "stub"
            - name: REGION
              value: "stub"
            - name: GLOBAL_S3_BUCKET
              value: "stub"
            - name: ENABLE_IMAGE_TRANSFORMATION
              value: "true"
            - name: IMGPROXY_URL
              value: "http://[%name%]-imgproxy:5001"
          probes:
            readiness:
              type: http
              port: http
              path: /status
              initialDelaySeconds: 5
              periodSeconds: 10
              failureThreshold: 6
            liveness:
              type: http
              port: http
              path: /status
              initialDelaySeconds: 15
              periodSeconds: 20
              failureThreshold: 3
          mounts:
            - volume: data
              path: /var/lib/storage
      volumes:
        - name: data
          persistent:
            size: 10Gi
            tier: standard
    - name: meta
      startupOrder: 2
      computePlan: small
      minComputePlan: small
      containers:
        - name: meta
          image: registry.stackship.se/blueprints/supabase/postgres-meta
          tag: "v0.100.0"
          # The image's own ENTRYPOINT and CMD, declared so the operator can wrap
          # them: a container with a vault-backed variable runs through the
          # secret-exec shim, and Kubernetes has no way to PREPEND to an
          # entrypoint — setting command replaces it. Without this the secret is
          # resolved and then dropped, which is how postgres reported its password
          # unset moments after secret-init reported resolving it.
          command:
            - docker-entrypoint.sh
          args:
            - node
            - dist/server/server.js
          ports:
            - name: http
              port: 8080
          env:
            - name: PG_META_PORT
              value: "8080"
            - name: PG_META_DB_HOST
              secretRef: { vault: "[%instance_vault%]", key: db_host }
            - name: PG_META_DB_PORT
              secretRef: { vault: "[%instance_vault%]", key: db_port }
            - name: PG_META_DB_NAME
              secretRef: { vault: "[%instance_vault%]", key: db_name }
            - name: PG_META_DB_SSL_MODE
              value: "require"
            # The database's owner: it owns the public schema, so tables created
            # in Studio are the application's, and it can read auth and storage.
            - name: PG_META_DB_USER
              secretRef: { vault: "[%instance_vault%]", key: db_owner }
            - name: PG_META_DB_PASSWORD
              secretRef: { vault: "[%instance_vault%]", key: db_owner_password }
            - name: CRYPTO_KEY
              secretRef: { vault: "[%instance_vault%]", key: pg_meta_crypto_key }
          probes:
            readiness:
              type: http
              port: http
              path: /health
              initialDelaySeconds: 5
              periodSeconds: 10
              failureThreshold: 6
            liveness:
              type: http
              port: http
              path: /health
              initialDelaySeconds: 10
              periodSeconds: 20
              failureThreshold: 3
    - name: gateway
      startupOrder: 3
      computePlan: small
      minComputePlan: small
      containers:
        - name: kong
          image: registry.stackship.se/blueprints/supabase/kong
          tag: "3.9.1"
          # Kong resolves {vault://...} references only in referenceable fields
          # (kong.conf, certain plugin fields, certificate fields) — NOT in a
          # consumer's key-auth credential key, which is a plain string field.
          # A {vault://env/...} there is stored verbatim, so the real anon /
          # service_role JWTs a client sends match nothing and key-auth returns
          # 401. The keys must therefore be substituted into the declarative
          # config from the vault-backed env before Kong reads it. sed (not a
          # bash `eval`) because kong.tmpl is full of double quotes; the JWTs are
          # base64url so `#` is a safe delimiter. The declarative config is
          # written to /kong-runtime/kong.yml (an emptyDir) from the read-only
          # kong.tmpl mount; the whole command is still wrapped by the
          # secret-exec shim so ANON_KEY / SERVICE_ROLE_KEY are in the env here.
          command:
            - /bin/sh
            - -c
            - |
              set -e
              sed "s#__ANON_KEY__#${ANON_KEY}#g; s#__SERVICE_ROLE_KEY__#${SERVICE_ROLE_KEY}#g" \
                /home/kong/kong.tmpl > /kong-runtime/kong.yml
              exec /entrypoint.sh kong docker-start
          ports:
            - name: http
              port: 8000
            - name: https
              port: 8443
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: "/kong-runtime/kong.yml"
            - name: KONG_DNS_ORDER
              value: "LAST,A,CNAME"
            - name: KONG_PLUGINS
              value: "request-transformer,cors,key-auth,acl,basic-auth"
            - name: KONG_NGINX_MAIN_WORKER_PROCESSES
              value: "1"
            - name: KONG_NGINX_PROXY_PROXY_BUFFER_SIZE
              value: "160k"
            - name: KONG_NGINX_PROXY_PROXY_BUFFERS
              value: "64 160k"
            - name: KONG_LOG_LEVEL
              value: "warn"
            - name: ANON_KEY
              secretRef: { vault: "[%instance_vault%]", key: anon_key }
            - name: SERVICE_ROLE_KEY
              secretRef: { vault: "[%instance_vault%]", key: service_role_key }
          probes:
            readiness:
              type: tcp
              port: http
              initialDelaySeconds: 10
              periodSeconds: 10
              failureThreshold: 6
            liveness:
              type: tcp
              port: http
              initialDelaySeconds: 20
              periodSeconds: 20
              failureThreshold: 3
          mounts:
            # Mounted as kong.tmpl (read-only); the command seds the JWT keys in
            # and writes the resolved kong.yml that KONG_DECLARATIVE_CONFIG names.
            - volume: config
              path: /home/kong/kong.tmpl
              subPath: kong.yml
              readOnly: true
            # The resolved config is written here, not next to kong.tmpl: the
            # image has no /home/kong of its own, so the kubelet creates it
            # root-owned for the mount above and Kong's user cannot write in it.
            - volume: runtime
              path: /kong-runtime
      volumes:
        - name: runtime
          emptyDir:
            sizeLimit: "1Mi"
        - name: config
          files:
            content:
              # Kong's entire declarative route table. Without it the gateway
              # starts and serves nothing.
              kong.yml: |
                _format_version: "2.1"
                _transform: true

                consumers:
                  - username: DASHBOARD
                  - username: anon
                    keyauth_credentials:
                      # Placeholders the container's start command replaces with
                      # the real JWTs from the vault-backed ANON_KEY /
                      # SERVICE_ROLE_KEY env vars. They stay placeholders in the
                      # ConfigMap and on the CR, so the JWT keys are never stored
                      # as plaintext there.
                      - key: "__ANON_KEY__"
                  - username: service_role
                    keyauth_credentials:
                      - key: "__SERVICE_ROLE_KEY__"

                acls:
                  - consumer: anon
                    group: anon
                  - consumer: service_role
                    group: admin

                services:
                  - name: auth-v1-open
                    url: http://[%name%]-auth:9999/verify
                    routes:
                      - name: auth-v1-open
                        strip_path: true
                        paths:
                          - /auth/v1/verify
                    plugins:
                      - name: cors
                  - name: auth-v1-open-callback
                    url: http://[%name%]-auth:9999/callback
                    routes:
                      - name: auth-v1-open-callback
                        strip_path: true
                        paths:
                          - /auth/v1/callback
                    plugins:
                      - name: cors
                  - name: auth-v1-open-authorize
                    url: http://[%name%]-auth:9999/authorize
                    routes:
                      - name: auth-v1-open-authorize
                        strip_path: true
                        paths:
                          - /auth/v1/authorize
                    plugins:
                      - name: cors
                  - name: auth-v1
                    _comment: "GoTrue: /auth/v1/* -> http://auth:9999/*"
                    url: http://[%name%]-auth:9999/
                    routes:
                      - name: auth-v1
                        strip_path: true
                        paths:
                          - /auth/v1/
                    plugins:
                      - name: cors
                      - name: key-auth
                        config:
                          hide_credentials: false
                      - name: acl
                        config:
                          hide_groups_header: true
                          allow:
                            - admin
                            - anon
                  - name: rest-v1
                    _comment: "PostgREST: /rest/v1/* -> http://rest:3000/*"
                    url: http://[%name%]-rest:3000/
                    routes:
                      - name: rest-v1
                        strip_path: true
                        paths:
                          - /rest/v1/
                    plugins:
                      - name: cors
                      - name: key-auth
                        config:
                          hide_credentials: false
                      - name: acl
                        config:
                          hide_groups_header: true
                          allow:
                            - admin
                            - anon
                  - name: storage-v1
                    _comment: "Storage: /storage/v1/* -> http://storage:5000/*"
                    url: http://[%name%]-storage:5000/
                    routes:
                      - name: storage-v1
                        strip_path: true
                        paths:
                          - /storage/v1/
                    plugins:
                      - name: cors
                      - name: key-auth
                        config:
                          hide_credentials: false
                      - name: acl
                        config:
