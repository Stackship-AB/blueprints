apiVersion: blueprints.stackship.se/v2
kind: BlueprintTemplate

# Keycloak from the official image, docker.io/keycloak/keycloak. Four facts read
# off `docker inspect` of that image shape most of what follows:
#
#   - ENTRYPOINT is /opt/keycloak/bin/kc.sh and there is NO CMD. The image does
#     nothing at all unless a subcommand is passed, which is why `args: [start]`
#     below is load-bearing rather than decorative.
#   - USER is 1000, and /opt/keycloak is owned by it.
#   - Ports 8080 (http), 8443 (https) and 9000 (management) are declared.
#   - KC_RUN_IN_CONTAINER=true is set in the image's own environment, which is
#     what makes kc.sh size the heap from the container limit.
#
# `start` runs Keycloak's augmentation on every pod start, because the image was
# built with a bare `kc.sh build` and so carries Keycloak's default `db=dev-file`
# — an H2 file database. `db` is a build-time option, and `start --optimized`
# against a differing one does not warn, it refuses to boot. Measured on 26.7:
# augmentation takes about three seconds and the pod reports ready in under
# fifteen, so this costs far less than the startupProbe budget below implies.
# That budget is a ceiling for a slow, cold, CPU-throttled node, not a forecast.
#
# The component is NOT marked `hardened`, deliberately. `hardened: true` sets
# readOnlyRootFilesystem, and the augmentation above writes its generated
# Quarkus application back into the image. Run this container --read-only and
# it dies on `/opt/keycloak/lib/quarkus/transformed-bytecode.jar: Read-only
# file system` before it ever opens a port. What that flag also buys is kept by
# other means: runAsUser pins the process to the image's own uid 1000, and the
# platform drops ALL capabilities and forbids privilege escalation on every
# container regardless of it.
#
# The instance is clusterable, which is worth saying because the obvious reading
# of a Kubernetes Keycloak is that it is not. Its session cache discovers peers
# through the database (`jdbc-ping`) rather than through a headless Service, so
# the usual blocker — no Service to run DNS_PING against — does not apply.
# `replicas` cannot be a template parameter, so it ships at 1; raise it in the
# component sheet afterwards and sessions survive.
#
# ── On the database ──────────────────────────────────────────────────────────
#
# A Stackship-managed PostgreSQL, declared as a resource, exactly as
# stackship-data-hub declares one. The platform provisions it, waits for it to
# accept connections, and writes its connection details into the instance vault
# before the containers below are created — so there is no bundled postgres pod
# here with no backups, no failover and no upgrade path, and no wait-for-db
# ordering to arrange either.
#
# The five settings arrive as five vault keys rather than one connection string,
# and that difference is the whole reason this shape was unavailable until
# recently. Data Hub consumes a connection string whole; Keycloak takes
# KC_DB_URL_HOST/_PORT/_DATABASE plus KC_DB_USERNAME/_PASSWORD separately, and
# its one whole-URL option wants a JDBC URL that neither composed form is —
# handed the `uri` output it dies on "Driver does not support the provided URL".
# A template has no string operations, so it cannot take a connection string
# apart itself.
#
# REQUIRES backend!616, which publishes `host`, `port`, `database`, `username`
# and `password` alongside the two composed forms. Deployed against a platform
# without it, this fails fast and by name — "'postgres' exposes no output named
# 'host'" — rather than deploying something subtly wrong.
#
# db_host and db_port are not secret, and still travel through the vault: the
# resource publishes all five the same way, and reading one of them differently
# would mean the template knew the database's address before it existed.

metadata:
  slug: keycloak
  title: Keycloak
  description: >-
    Keycloak identity and access management: single sign-on with OpenID Connect,
    OAuth 2.0 and SAML, user federation against LDAP or Active Directory, social
    login, and fine-grained authorization — with an admin console and a
    self-service account console for your users.
  version: "26.7.3"
  category: Platforms
  tags: [keycloak, identity, sso, oidc, oauth2, saml, auth, iam]
  documentation: https://www.keycloak.org/documentation

parameters:
  - name: version
    type: Select
    label: Keycloak Version
    description: >-
      Tag on docker.io/keycloak/keycloak. A minor tag such as "26.7" follows its
      patch releases, which is how a fix reaches you without an edit; pin the
      exact patch for an installation that must not move on its own.
    options: ["26.7.3", "26.7"]
    default: "26.7.3"
    documentation: https://hub.docker.com/r/keycloak/keycloak

  - name: compute_plan
    type: Select
    label: Compute Plan
    description: >-
      Memory is what decides this, not CPU: the heap is sized at 70% of the
      plan's limit, so "medium" leaves Keycloak about 700MB and "large" about
      2.8GB. Medium runs a modest realm perfectly well; large is the one to pick
      for anything with real user volume or many clients.
    options: ["large", "medium"]
    default: "large"

  - name: admin_username
    type: String
    label: Admin Username
    description: Bootstrap administrator, created on the very first start only.
    default: "admin"

  - name: admin_password
    type: Secret
    label: Admin Password
    description: >-
      Password for the bootstrap administrator. Auto-generated; read it from the
      instance vault, and change it in the console once you are in.
    generate: true
    generateLength: 24

  - name: db_availability
    type: Select
    label: Database
    description: >-
      A Stackship-managed PostgreSQL, with backups and the platform's own
      upgrade path. High availability runs three instances so the loss of a
      node promotes a replica instead of taking the database down.
    options: ["Single Instance", "High Available"]
    default: "Single Instance"

  - name: db_storage_size
    type: Select
    label: Database Storage
    description: Volume for the managed PostgreSQL
    options: ["5Gi", "10Gi", "20Gi", "50Gi"]
    default: "10Gi"

  - name: ingress_host
    type: String
    label: Public Hostname
    description: >-
      Public hostname for the instance. Keycloak bakes this into the issuer of
      every token it signs, so moving it later invalidates existing clients —
      choose the name you intend to keep.
    default: "[%name%].{{domain_suffix}}"

  - name: ingress_certificate_issuer
    type: String
    label: Certificate Issuer
    description: cert-manager ClusterIssuer name
    default: "{{cert_issuer}}"
    advanced: true

  # ── Custom theme ──────────────────────────────────────────────────────────
  #
  # A theme is a .jar, and it reaches Keycloak as an IMAGE pulled through one of
  # the boundary's deployment sources rather than as a URL fetched at startup.
  # The kubelet pulls it, so the pod needs no egress; a restart reuses the
  # node's cached image instead of downloading again; a digest in theme_tag pins
  # the exact bytes; and the registry credential never enters the pod. See the
  # init container below for what the image must contain.
  #
  # REQUIRES the backend that knows the DeploymentSource parameter type and
  # per-container `condition`. An older one rejects this file by name and keeps
  # serving the previous revision of the blueprint.
  - name: theme_enabled
    type: Boolean
    label: Custom Theme
    description: >-
      Load theme .jar files from an image into Keycloak's providers directory.
      Choose the theme per realm afterwards, in the admin console or with
      loginTheme in an imported realm.json.
    default: "false"
    advanced: true

  - name: theme_source
    type: DeploymentSource
    capability: ImagePull
    label: Theme Registry
    description: >-
      The private registry the theme image is pulled through. Leave it at none
      for a public image.
    default: ""
    advanced: true

  - name: theme_image
    type: String
    label: Theme Image
    description: >-
      Repository of the theme image, without a tag, e.g. ghcr.io/acme/keycloak-theme.
      Its /theme directory must hold the .jar files, and it needs /bin/sh and
      cp — FROM busybox with a COPY into /theme is enough. A theme jar can carry
      code as well as CSS, so only use an image you trust.
    default: ""
    advanced: true
    validation:
      pattern: "^([a-z0-9]+([._-][a-z0-9]+)*(:[0-9]+)?/)*[a-z0-9]+([._-][a-z0-9]+)*$"
      message: Must be an image repository without a tag, e.g. ghcr.io/acme/keycloak-theme

  - name: theme_tag
    type: String
    label: Theme Tag
    description: >-
      Tag or digest of the theme image. A sha256 digest pins the theme's exact
      content; a moving tag changes nothing until the pod next restarts.
    default: "latest"
    advanced: true

outputs:
  - name: console_url
    label: Admin Console
    description: Keycloak administration console
    type: Url
    value: "https://[%ingress_host%]/admin"
  - name: account_url
    label: Account Console
    description: Self-service account console for users of the master realm
    type: Url
    value: "https://[%ingress_host%]/realms/master/account"
  - name: issuer_url
    label: Issuer (master realm)
    description: OIDC issuer for the master realm; each realm you create gets its own
    type: Url
    value: "https://[%ingress_host%]/realms/master"
  - name: discovery_url
    label: OIDC Discovery
    description: Point a relying party's OIDC authority at this
    type: Url
    value: "https://[%ingress_host%]/realms/master/.well-known/openid-configuration"
  - name: admin_username
    label: Admin Username
    description: The bootstrap administrator; its password is in the instance vault
    type: String
    value: "[%admin_username%]"

# The database, provisioned by the platform rather than run as a container here.
# `name: db` makes the cluster {instance}-db, scoped to this instance so two
# deployments of this blueprint into one resource group cannot silently share
# one database.
resources:
  - name: db
    type: postgres
    availability: "[%db_availability%]"
    storage: "[%db_storage_size%]"
    exposes:
      - output: host
        vaultKey: db_host
      - output: port
        vaultKey: db_port
      - output: database
        vaultKey: db_name
      - output: username
        vaultKey: db_user
      - output: password
        vaultKey: db_password

instance:
  components:
    - name: keycloak
      # The only component. Database readiness is not this file's problem: the
      # platform provisions the declared resource and polls it until it accepts
      # connections BEFORE the instance is created, so Keycloak has never yet
      # been started against a cluster still running initdb.
      startupOrder: 1
      # One by default, but not one by necessity — scale it in the component
      # sheet and sessions follow, because of the cache stack configured below.
      # `replicas` cannot be a parameter: substitution walks typed fields and
      # only rewrites strings, and this is an int. It is also excluded from the
      # pod-affecting hash, so changing it later scales without rolling pods.
      replicas: 1
      # The image's own uid. Its gid is deliberately left alone: /opt/keycloak
      # is owned by 1000 with group 0, and pinning a group here would take away
      # the group-writable bit the augmentation relies on.
      runAsUser: 1000
      computePlan: "[%compute_plan%]"
      initContainers:
        # Copies the theme image's jars into the providers volume, which the
        # keycloak container mounts over /opt/keycloak/providers. No download:
        # the kubelet has already pulled the image, through theme_source when
        # one is set. `start` without --optimized re-runs augmentation on every
        # boot, and augmentation is what picks new providers up.
        #
        # Gated as a whole rather than left to exit early, because an empty
        # theme_image is not an image the platform will accept at all.
        #
        # The ls fails the pod with Init:Error when /theme holds no jar, rather
        # than starting Keycloak without the theme someone asked for. It runs as
        # uid 1000 like the rest of the component, so the jars must be readable
        # by it — which files added by a Dockerfile COPY are.
        - name: theme
          condition: theme_enabled
          image: "[%theme_image%]"
          tag: "[%theme_tag%]"
          sourceRef: "[%theme_source%]"
          command: ["/bin/sh"]
          args: ["-c", "set -eu; ls /theme/*.jar >/dev/null; cp /theme/*.jar /providers/"]
          mounts:
            - volume: providers
              path: /providers
      containers:
        - name: keycloak
          image: docker.io/keycloak/keycloak
          tag: "[%version%]"
          # The image's ENTRYPOINT verbatim, and the subcommand it has no CMD
          # for. Declaring the entrypoint is also what makes secret delivery
          # work at all: a container with a vault-backed env var runs through
          # the secret-exec shim, and Kubernetes cannot PREPEND to an entrypoint
          # — setting `command` replaces it. Omit these and all five database
          # settings below are resolved and then silently dropped.
          command: [/opt/keycloak/bin/kc.sh]
          # `--import-realm` reads every regular .json file in
          # /opt/keycloak/data/import at startup, which the volume below supplies.
          # It ships enabled rather than as a parameter because it costs an empty
          # directory scan when there is nothing to import, and adding it later
          # means editing argv on a running instance — the one edit a person
          # deploying a realm is least equipped to get right.
          #
          # First-boot semantics, not a sync: a realm that already exists is
          # SKIPPED, so changing the file below re-rolls the pod and imports
          # nothing. Re-importing a changed realm means deleting it in the console
          # first, or running `kc.sh import --override true` yourself.
          args: [start, --import-realm]
          # No JAVA_OPTS here on purpose. kc.sh sizes the heap from the
          # container's memory limit — MaxRAMPercentage=70 — but only when
          # KC_RUN_IN_CONTAINER is true, and the image sets exactly that in its
          # own environment. Without it the fallback is a hard -Xmx512m, which
          # would make the compute plan above almost meaningless. Setting
          # JAVA_OPTS here would replace the whole set, not add to it; use
          # JAVA_OPTS_APPEND if something ever needs adding.
          ports:
            - name: http
              port: 8080
            # Keycloak 26 serves /health and /metrics on a separate management
            # port. It stays off the ingress below: readiness detail and a
            # metrics scrape are not things to publish on the internet.
            - name: management
              port: 9000
          env:
            - name: KC_DB
              value: postgres
            # All five from the vault, under the keys the resources block above
            # names. None is substituted into the spec: the password would be
            # readable to every holder of containerinstance/read if it were, and
            # splitting the five across two mechanisms to save three lines would
            # be a difference with no meaning behind it.
            - name: KC_DB_URL_HOST
              secretRef: { vault: "[%instance_vault%]", key: db_host }
            - name: KC_DB_URL_PORT
              secretRef: { vault: "[%instance_vault%]", key: db_port }
            - name: KC_DB_URL_DATABASE
              secretRef: { vault: "[%instance_vault%]", key: db_name }
            - name: KC_DB_USERNAME
              secretRef: { vault: "[%instance_vault%]", key: db_user }
            - name: KC_DB_PASSWORD
              secretRef: { vault: "[%instance_vault%]", key: db_password }

            # The full public URL, not a bare hostname: Keycloak derives the
            # issuer and every redirect it hands a client from this, and behind
            # a TLS-terminating ingress it cannot infer the scheme itself.
            - name: KC_HOSTNAME
              value: "https://[%ingress_host%]"
            # TLS ends at the ingress, so the pod speaks plain HTTP and trusts
            # the X-Forwarded-* headers the controller sets. Without
            # KC_HTTP_ENABLED a production-mode start refuses to listen at all.
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded

            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"

            # Clustered session cache, discovering peers through the database
            # rather than the network. JGroups' older stacks want a headless
            # Service and DNS_PING or KUBE_PING, neither of which a component
            # gets here — jdbc-ping instead keeps a membership table
            # (`jgroups_ping`) in the Keycloak database every replica already
            # talks to, which is why this works with nothing but the connection
            # settings above. It is Keycloak's own default from 26.1 and pinned
            # here so a future default cannot move it silently. Peers then talk
            # directly on 7800 and 57800; the boundary's allow-same-boundary
            # NetworkPolicy permits that, so no port needs declaring for it.
            - name: KC_CACHE
              value: ispn
            - name: KC_CACHE_STACK
              value: jdbc-ping

            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: "[%admin_username%]"
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              secretRef: { vault: "[%instance_vault%]", key: admin_password }
          probes:
            # Measured on 26.7 against a warm PostgreSQL: augmentation about
            # three seconds, ready in under fifteen. The threshold below is
            # five minutes because a cold node pulling a 500MB image onto a
            # throttled CPU is a different story, and a startup budget that is
            # merely typical turns a slow first boot into a crash loop that
            # reads as a broken image. Liveness does not run until this passes.
            startup:
              type: http
              port: management
              path: /health/started
              initialDelaySeconds: 20
              periodSeconds: 5
              failureThreshold: 60
            readiness:
              type: http
              port: management
              path: /health/ready
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            liveness:
              type: http
              port: management
              path: /health/live
              periodSeconds: 20
              timeoutSeconds: 5
              failureThreshold: 3
          # The whole volume, not a subPath of it. A subPath names one key, and a
          # key that does not exist yet leaves the pod stuck in ContainerCreating —
          # which is exactly the state a template shipping a placeholder would put
          # every deployment in. Mounting the directory is safe here because the
          # image has nothing of its own in data/import to hide.
          mounts:
            - volume: realm-import
              path: /opt/keycloak/data/import
              readOnly: true
            # Always mounted, theme or not: an empty directory is simply no
            # providers.
            - volume: providers
              path: /opt/keycloak/providers
              readOnly: true
      volumes:
        # Filled by the theme init container, when there is one. Jars only, so
        # it lives and dies with the pod.
        - name: providers
          emptyDir:
            sizeLimit: "50Mi"
        # Literal content, materialized by the platform as a ConfigMap it owns.
        # The placeholder is not decoration: a files volume must declare at least
        # one file, so there is no way to ship the mount and the argv without
        # shipping something to put in it. Keycloak ignores it — only .json is
        # read — which is what makes it a safe thing to leave in place.
        #
        # To import a realm, replace this content with your export as realm.json.
        # It travels in the instance spec, so it survives a recreate and shows up
        # in revisions, unlike a file uploaded onto a disk. The ceiling is 900 KiB
        # for the volume as a whole; a realm exported WITHOUT users generally fits,
        # one exported with them generally does not. Mark the volume `sensitive:
        # true` if the export carries client secrets, and read the note in the
        # portal about the `<redacted>` marker before editing it a second time.
        - name: realm-import
          files:
            content:
              README.txt: |
                Replace this volume's content with your realm export, as realm.json.
                Keycloak imports it on the next start, and skips any realm that
                already exists.

  endpoints:
    # If a login round-trip returns 502 from an nginx ingress controller, this
    # is why: Keycloak's OIDC responses carry state in headers and cookies large
    # enough to overrun the default 4k proxy buffer. The fix is
    # `nginx.ingress.kubernetes.io/proxy-buffer-size: 128k`, which an endpoint
    # cannot express — it has no annotations field — so it belongs to whoever
    # configures the ingress controller, not to this file.
    - name: web
      component: keycloak
      port: http
      expose: ingress
      hostname: "[%ingress_host%]"
      issuer: "[%ingress_certificate_issuer%]"
