apiVersion: blueprints.stackship.se/v2
kind: BlueprintTemplate

# Ported from the v1 rendered-manifest form. Unlike supabase this one needed no
# new format features — Service, StatefulSet and Ingress map straight onto a
# component with a persistent volume and one endpoint.
#
# There is no official PocketBase container image: upstream ships release zips,
# not a Dockerfile, and `ghcr.io/pocketbase/pocketbase` — what the v1 port
# pointed at — has never existed. We use docker.io/elestio/pocketbase. Three
# things about it shape this file:
#
#   - Its tags carry a `v` prefix, so the tag is built as `v[%version%]` and the
#     `version` parameter stays a bare PocketBase version, matching
#     metadata.version and what the release notes call it.
#   - It does not mirror every upstream patch (0.39.4 and 0.37.4/.5 were never
#     published, and it lags upstream releases), so the option below is the
#     newest tag confirmed to resolve rather than the newest upstream patch.
#   - Its entrypoint is `pocketbase serve --http=0.0.0.0:8090 --dir=/pb_data`
#     running as the non-root `pocketbase` user, which is why the volume mounts
#     at /pb_data and why fsGroup below is load-bearing: it is what leaves the
#     mounted PV group-writable for that user.

metadata:
  slug: pocketbase
  title: PocketBase
  description: >-
    PocketBase is an open source backend consisting of a realtime database,
    authentication, file storage, and more.
  version: "0.40.1"
  category: Databases
  tags: [pocketbase, database, realtime, auth, file-storage]
  documentation: https://pocketbase.io/docs/

parameters:
  - name: version
    type: Select
    label: PocketBase Version
    description: PocketBase release to run
    options: ["0.40.1"]
    default: "0.40.1"

  - name: storage_size
    type: Select
    label: Database Storage
    description: Persistent volume size for PocketBase data
    options: ["1Gi", "5Gi", "10Gi", "20Gi"]
    default: "5Gi"

  - name: ingress_host
    type: String
    label: Ingress Hostname
    description: >-
      Public hostname for the instance. Defaults to the instance name under the
      platform domain — override to use a custom domain.
    default: "[%name%].{{domain_suffix}}"

  - name: ingress_certificate_issuer
    type: String
    label: Certificate Issuer
    description: cert-manager ClusterIssuer name
    default: "{{cert_issuer}}"
    advanced: true

outputs:
  - name: admin_url
    label: Admin UI
    description: PocketBase admin dashboard
    type: Url
    value: "https://[%ingress_host%]/_/"
  - name: api_url
    label: API URL
    description: REST API base for SDK and HTTP clients
    type: Url
    value: "https://[%ingress_host%]/api/"

instance:
  components:
    - name: pocketbase
      startupOrder: 1
      replicas: 1
      computePlan: small
      containers:
        - name: pocketbase
          image: docker.io/elestio/pocketbase
          tag: "v[%version%]"
          ports:
            - name: http
              port: 8090
          probes:
            readiness:
              type: http
              port: http
              path: /api/health
              initialDelaySeconds: 5
              periodSeconds: 10
              failureThreshold: 6
            liveness:
              type: http
              port: http
              path: /api/health
              initialDelaySeconds: 15
              periodSeconds: 20
              failureThreshold: 3
          mounts:
            - volume: data
              path: /pb_data
      volumes:
        - name: data
          persistent:
            size: "[%storage_size%]"
            tier: standard
            fsGroup: 2000

  endpoints:
    - name: web
      component: pocketbase
      port: http
      expose: ingress
      hostname: "[%ingress_host%]"
      issuer: "[%ingress_certificate_issuer%]"
